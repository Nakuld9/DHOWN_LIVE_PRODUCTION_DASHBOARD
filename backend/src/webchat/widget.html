<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Chat with us</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #09090b; color: #f3f3f5; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; flex-direction: column; }
  #hdr { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid #2a2a31; background: #0d0d0f; }
  #logo { width: 34px; height: 34px; border-radius: 8px; object-fit: contain; background: #ffd400; display: block; }
  #co { font-weight: 700; font-size: 15px; }
  #status { font-size: 11.5px; color: #57d977; }
  #list { flex: 1; overflow-y: auto; padding: 14px 14px 6px; }
  .row { display: flex; margin-bottom: 8px; }
  .row.user { justify-content: flex-end; }
  .bub { max-width: 82%; padding: 9px 13px; border-radius: 12px; font-size: 14px; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
  .row.user .bub { background: #ffd400; color: #171200; border-bottom-right-radius: 3px; }
  .row.bot .bub { background: #141417; color: #f3f3f5; border: 1px solid #2a2a31; border-bottom-left-radius: 3px; }
  #compose { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #2a2a31; background: #0d0d0f; }
  #txt { flex: 1; resize: none; background: #09090b; border: 1px solid #2a2a31; border-radius: 9px; padding: 10px 12px; color: #f3f3f5; font-size: 14px; font-family: inherit; max-height: 120px; }
  #send { background: #ffd400; color: #171200; border: none; border-radius: 9px; padding: 0 18px; font-weight: 700; font-size: 14px; cursor: pointer; }
  #send:disabled { opacity: .5; cursor: default; }
</style>

  var busy = false, count = 0;

  function esc(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
  function add(role, text) { var r = document.createElement("div"); r.className = "row " + role; r.innerHTML = '<div class="bub">' + esc(text) + '</div>'; list.appendChild(r); list.scrollTop = list.scrollHeight; }
  async function j(r) { var t = await r.text(); try { return JSON.parse(t); } catch (e) { throw new Error("bad response"); } }

  (async function init() {
    try {
      var cfg = await j(await fetch(API + "/api/webchat/config"));
      if (cfg.company) { document.getElementById("co").textContent = cfg.company; document.title = "Chat with " + cfg.company; }
      var h = await j(await fetch(API + "/api/webchat/history?session=" + encodeURIComponent(session)));
      if (h.messages && h.messages.length) { h.messages.forEach(function (m) { add(m.role, m.text); }); count = h.messages.length; }
      else if (cfg.greeting) { add("bot", cfg.greeting); }
    } catch (e) { add("bot", "Hi! How can we help you today?"); }
  })();

  async function post() {
    var text = txt.value.trim();
    if (!text || busy) return;
    txt.value = ""; add("user", text); busy = true; send.disabled = true;
    try {
      var res = await j(await fetch(API + "/api/webchat/message", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session: session, text: text }) }));
      add("bot", res.reply || "Thanks — we'll get back to you shortly.");
      count += 2;
    } catch (e) { add("bot", "Sorry, that didn't go through. Please try again."); }
    finally { busy = false; send.disabled = false; txt.focus(); }
  }
  send.onclick = post;
  txt.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); post(); } });

  // Poll so a staff reply from the CRM inbox reaches the visitor.
  setInterval(async function () {
    if (busy) return;
    try {
      var h = await j(await fetch(API + "/api/webchat/history?session=" + encodeURIComponent(session)));
      if (h.messages && h.messages.length > count) { list.innerHTML = ""; h.messages.forEach(function (m) { add(m.role, m.text); }); count = h.messages.length; }
    } catch (e) {}
  }, 6000);
})();
</script>
</body>
</html>
